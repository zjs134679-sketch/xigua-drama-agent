[package]
name = "xigua-drama-agent"
version = "0.1.0"
edition = "2021"
description = "西瓜短剧Agent（国内版）桌面壳"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
